<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>METRO CITY — Open World</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="loading"><div class="loader-mark">MC</div><div class="loading-title">METRO CITY</div><div class="loading-sub">BUILDING YOUR WORLD</div><div class="load-track"><i id="load-progress"></i></div></div>
<canvas id="world"></canvas><div id="hud"><div class="brand"><b>METRO</b><span>CITY</span></div><div class="hud-right"><div class="cash">$ <span id="cash-value">2,500</span></div><div class="clock" id="clock">08:42</div></div><canvas id="minimap" width="180" height="180" aria-label="Nearby city map"></canvas><div class="network"><button id="network-toggle" class="network-toggle">MULTIPLAYER</button><div id="network-panel" class="network-panel"><input id="room-code" maxlength="6" inputmode="numeric" placeholder="6-digit room"><div><button id="host-room">HOST</button><button id="join-room">JOIN</button></div><small id="network-status">Not connected</small></div></div><div class="mission"><small>FREE ROAM</small><b>Explore the city</b><span id="mission-sub">Find a car and hit the road.</span><button id="mission-start" class="mission-start">START MISSION</button></div><div class="speed" id="speed">000 <small>KM/H</small></div><div class="toast" id="toast">Welcome to Metro City</div>
<div class="controls"><div class="move-pad"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div><div class="action-pad"><button id="enter" class="action">ENTER CAR</button><button id="run" class="action secondary">SPRINT</button></div><div class="drive-pad" id="drive-pad">
 <div class="steer-pad" aria-label="Steering"><span class="control-caption">STEERING</span><div class="steer-buttons"><button data-drive="left" aria-label="Steer left">◀</button><button data-drive="right" aria-label="Steer right">▶</button></div></div>
 <div class="pedal-pad" aria-label="Pedals"><button data-drive="brake" class="brake">BRAKE</button><button data-drive="gas" class="gas">GAS</button><button data-drive="handbrake" class="handbrake">HANDBRAKE</button><button id="camera-toggle" class="camera-control">CAM</button></div>
</div></div><div class="hint">WASD / ARROWS · E ENTER / EXIT · SHIFT SPRINT</div></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}
</script>
<script>
/* Keep the splash screen from hanging forever if a module/CDN/WebGL error prevents startup. */
window.setTimeout(function(){
  var splash=document.getElementById('loading');
  var hud=document.getElementById('hud');
  if(splash && splash.isConnected && hud && getComputedStyle(hud).opacity==='0'){
    var sub=splash.querySelector('.loading-sub');
    if(sub) sub.textContent='GAME DID NOT START · CHECK CONNECTION';
    var bar=splash.querySelector('.load-track');
    if(bar) bar.style.display='none';
    var retry=document.createElement('button');
    retry.textContent='RELOAD GAME';
    retry.style.cssText='margin-top:28px;padding:12px 24px;border:1px solid #b9d9e9;background:#172a38;color:#fff;letter-spacing:2px;font-weight:700;border-radius:4px';
    retry.onclick=function(){location.reload()};
    splash.appendChild(retry);
  }
},18000);
</script>
<script type="module" src="./src/main.js"></script></body></html>
